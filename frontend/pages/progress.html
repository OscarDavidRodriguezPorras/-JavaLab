<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaLab — Progreso</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>

    <main class="main">
      <div id="topbar-root"></div>

      <div class="section-title"><h2>📊 Mi progreso</h2></div>

      <div class="grid grid--2">
        <div class="card">
          <h3 style="font-size:14px; margin-bottom:14px;">Progreso por tema</h3>
          <div id="topics-progress"><p class="empty-state">Cargando…</p></div>
        </div>

        <div>
          <div class="card" style="margin-bottom:18px;">
            <h3 style="font-size:14px; margin-bottom:14px;">🏆 Logros</h3>
            <div id="achievements-grid" style="display:flex; gap:10px; flex-wrap:wrap;"></div>
          </div>

          <div class="card">
            <h3 style="font-size:14px; margin-bottom:14px;">⚠️ Errores frecuentes</h3>
            <div id="weaknesses-list"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/progress.js"></script>
</body>
</html>
