<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaLab — Editor</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .editor-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 18px;
      align-items: start;
    }
    .editor-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .editor-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-panel-raised);
    }
    .editor-filename { font-family: var(--font-mono); font-size: 13px; color: var(--text-secondary); }
    #monaco-container { height: 460px; }
    .editor-actions { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--border-subtle); flex-wrap: wrap; }
    .console {
      background: var(--bg-void);
      border-top: 1px solid var(--border-subtle);
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 14px;
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
      color: var(--text-secondary);
    }
    .console .ok { color: var(--accent-green); }
    .console .err { color: var(--accent-coral); }
    .hint-block {
      background: var(--bg-panel-raised);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    @media (max-width: 980px) {
      .editor-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>

    <main class="main">
      <div id="topbar-root"></div>

      <div id="exercise-header" class="hero-card" style="padding: 20px 24px;">
        <p class="empty-state">Cargando ejercicio…</p>
      </div>

      <div class="editor-layout">
        <div class="editor-panel">
          <div class="editor-topbar">
            <span class="editor-filename">Main.java</span>
            <span class="chip">Java</span>
          </div>
          <div id="monaco-container"></div>
          <div class="editor-actions">
            <button class="btn btn--ghost btn--sm" id="run-btn">▶ Ejecutar</button>
            <button class="btn btn--primary btn--sm" id="verify-btn">✓ Verificar</button>
            <button class="btn btn--ghost btn--sm" id="reset-btn">↻ Reiniciar</button>
          </div>
          <div class="console" id="console">// La salida de tu programa aparecerá aquí.</div>
        </div>

        <div>
          <div class="card" style="margin-bottom: 16px;">
            <h3 style="font-size:14px; margin-bottom:10px;">📋 Requisitos</h3>
            <ul id="requirements-list" style="margin:0; padding-left:18px; font-size:13px; color:var(--text-secondary);"></ul>
          </div>

          <div class="card" style="margin-bottom: 16px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
              <h3 style="font-size:14px; margin:0;">💡 Pistas</h3>
              <span id="hint-count" class="chip">0/3</span>
            </div>
            <div id="hints-container"></div>
            <button class="btn btn--ghost btn--sm btn--block" id="next-hint-btn">Pedir pista</button>
            <button class="btn btn--ghost btn--sm btn--block hidden" id="show-solution-btn" style="margin-top:8px;">👀 Ver solución</button>
          </div>

          <div class="card" id="feedback-card" style="display:none;"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs/loader.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/editor.js"></script>
</body>
</html>
