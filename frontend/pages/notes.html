<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaLab — Apuntes</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>
 
    <main class="main">
      <div id="topbar-root"></div>
 
      <div class="section-title">
        <h2>📚 Mis apuntes</h2>
        <button class="btn btn--primary" id="new-note-btn">+ Nuevo apunte</button>
      </div>
 
      <div class="card" style="margin-bottom: 20px; display:flex; gap:12px; flex-wrap:wrap;">
        <input class="input" id="search-input" placeholder="Buscar apuntes..." style="max-width: 260px;" />
        <select class="select" id="category-filter" style="max-width: 200px;">
          <option value="">Todas las categorías</option>
        </select>
      </div>
 
      <div id="notes-list" class="grid grid--cards"></div>
    </main>
  </div>
 
  <div class="modal-overlay hidden" id="note-modal">
    <div class="modal">
      <div class="modal__header">
        <h2>Nuevo apunte</h2>
        <button class="modal__close" id="note-modal-close">✕</button>
      </div>
      <form id="note-form">
        <div class="field">
          <label for="note-title">Título</label>
          <input class="input" id="note-title" required placeholder="Ej. Conversión de datos" />
        </div>
        <div class="field">
          <label for="note-category">Categoría</label>
          <input class="input" id="note-category" list="category-options" placeholder="Ej. Variables" />
          <datalist id="category-options"></datalist>
        </div>
        <button type="submit" class="btn btn--primary btn--block">Continuar →</button>
      </form>
    </div>
  </div>
 
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/notes.js"></script>
</body>
</html>
