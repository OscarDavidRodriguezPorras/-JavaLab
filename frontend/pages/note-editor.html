<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaLab — Editor de apunte</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .note-editor-layout {
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 18px;
      align-items: start;
    }
    .doc-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .doc-title-row {
      display: flex; gap: 10px; padding: 14px; border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
    }
    .doc-title-row .input { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
    .toolbar {
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-panel-raised);
    }
    .toolbar button {
      background: transparent; color: var(--text-secondary);
      border: 1px solid transparent; border-radius: 6px;
      width: 32px; height: 32px; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .toolbar button:hover { background: var(--bg-panel-hover); color: var(--text-primary); }
    .toolbar button.is-active { border-color: var(--accent-blue); color: var(--accent-blue); }
    .toolbar .sep { width: 1px; height: 20px; background: var(--border-subtle); margin: 0 4px; }
    .toolbar input[type="color"] {
      width: 30px; height: 30px; border: none; background: transparent; cursor: pointer; padding: 0;
    }
    #doc-content {
      min-height: 480px;
      padding: 24px 28px;
      font-size: 14.5px;
      line-height: 1.7;
      outline: none;
    }
    #doc-content:empty::before {
      content: "Escribe tu apunte aquí...";
      color: var(--text-muted);
    }
    .side-panel .card { margin-bottom: 16px; }
    #images-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .image-thumb {
      width: 62px; height: 62px; object-fit: cover;
      border-radius: 8px; border: 1px solid var(--border-subtle);
      cursor: pointer; transition: border-color 0.15s ease, transform 0.1s ease;
    }
    .image-thumb:hover { border-color: var(--accent-blue); transform: scale(1.04); }
    .image-item { position: relative; width: 62px; height: 62px; }
    .image-item .image-thumb { width: 100%; height: 100%; }
    .image-delete-btn {
      position: absolute; top: -6px; right: -6px;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--accent-coral); color: #fff;
      font-size: 11px; line-height: 1; display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--bg-panel); opacity: 0; transition: opacity 0.12s ease;
    }
    .image-item:hover .image-delete-btn { opacity: 1; }
    #doc-content.is-drag-over { outline: 2px dashed var(--accent-blue); outline-offset: -6px; }
    @media (max-width: 900px) {
      .note-editor-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>

    <main class="main">
      <div id="topbar-root"></div>

      <div class="section-title">
        <h2>📝 Apunte</h2>
        <div style="display:flex; gap:8px;">
          <a href="/pages/notes.html" class="btn btn--ghost btn--sm">← Volver</a>
          <button class="btn btn--danger btn--sm" id="delete-btn">Eliminar</button>
          <button class="btn btn--primary btn--sm" id="save-btn">Guardar</button>
        </div>
      </div>

      <div class="note-editor-layout">
        <div class="doc-panel">
          <div class="doc-title-row">
            <input class="input" id="doc-title" placeholder="Título del apunte" style="flex:2;" />
            <input class="input" id="doc-category" placeholder="Categoría" style="flex:1;" />
          </div>

          <div class="toolbar">
            <button type="button" data-cmd="bold" title="Negrita"><b>B</b></button>
            <button type="button" data-cmd="italic" title="Cursiva"><i>I</i></button>
            <button type="button" data-cmd="underline" title="Subrayado"><u>U</u></button>
            <div class="sep"></div>
            <button type="button" id="uppercase-btn" title="MAYÚSCULAS">Aa</button>
            <button type="button" id="lowercase-btn" title="minúsculas">aa</button>
            <div class="sep"></div>
            <button type="button" data-cmd="insertUnorderedList" title="Lista">•≡</button>
            <button type="button" data-cmd="formatBlock" data-value="pre" title="Código">&lt;/&gt;</button>
            <div class="sep"></div>
            <input type="color" id="text-color" title="Color de texto" value="#eaeefb" />
          </div>

          <div id="doc-content" contenteditable="true"></div>
        </div>

        <div class="side-panel">
          <div class="card">
            <h3 style="font-size:13.5px; margin-bottom:10px;">🖼️ Imágenes</h3>
            <div id="images-list"></div>
            <input type="file" id="image-input" accept="image/*" class="input" style="margin-top:8px;" />
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay hidden" id="lightbox-overlay">
    <div style="position: relative;">
      <button class="modal__close" id="lightbox-close" style="position:absolute; top:-44px; right:0;">✕</button>
      <img id="lightbox-img" src="" style="max-width: 84vw; max-height: 84vh; border-radius: 10px;" />
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/note-editor.js"></script>
</body>
</html>
