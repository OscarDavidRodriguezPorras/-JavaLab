<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaLab — Tutor IA</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .chat-shell {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      height: 68vh;
      max-width: 720px;
    }
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display:flex; flex-direction:column; gap:14px; }
    .chat-msg { max-width: 80%; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13.5px; line-height:1.5; }
    .chat-msg.student { align-self: flex-end; background: var(--accent-blue-dim); color: #fff; }
    .chat-msg.tutor { align-self: flex-start; background: var(--bg-panel-raised); border: 1px solid var(--border-subtle); white-space: pre-wrap; }
    .chat-input-row { display:flex; gap:10px; padding: 14px; border-top: 1px solid var(--border-subtle); }
    .chat-input-row textarea { flex:1; }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>

    <main class="main">
      <div id="topbar-root"></div>

      <div class="section-title"><h2>🤖 Tutor IA</h2></div>
      <p style="color:var(--text-secondary); font-size:13.5px; max-width:560px; margin-top:-8px; margin-bottom:18px;">
        Pregúntame lo que no entiendas de tu código. No te doy la solución completa de inmediato: primero te explico
        el concepto y te doy pistas para que llegues por tu cuenta.
      </p>

      <div class="chat-shell card" style="padding:0;">
        <div class="chat-messages" id="chat-messages">
          <div class="chat-msg tutor">¡Hola! Cuéntame qué duda tienes o pega el código con el que estás batallando. 👋</div>
        </div>
        <div class="chat-input-row">
          <textarea class="textarea" id="chat-input" rows="2" placeholder="Ej. No entiendo por qué ParseFloat me da error..."></textarea>
          <button class="btn btn--primary" id="chat-send-btn">Enviar</button>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/tutor.js"></script>
</body>
</html>
