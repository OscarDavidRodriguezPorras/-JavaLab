<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaLab — Inicio</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>

    <main class="main">
      <div id="topbar-root"></div>

      <section class="hero-card">
        <h1 id="greeting">¡Hola! 👋</h1>
        <p style="color: var(--text-secondary); max-width: 480px;">Sigue practicando y llegarás muy lejos.</p>
        <div class="stat-row" id="hero-stats"></div>
      </section>

      <div class="grid grid--2" style="margin-bottom: 22px;">
        <div class="card">
          <div class="section-title">
            <h2>📊 Tu progreso en Java</h2>
            <a href="/pages/progress.html" style="font-size: 12.5px;">Ver todo →</a>
          </div>
          <div id="progress-overview">
            <p class="empty-state">Cargando progreso…</p>
          </div>
        </div>

        <div class="card" style="background: linear-gradient(160deg, #1E2A18, var(--bg-panel));">
          <div class="section-title">
            <h2>🔥 Reto del día</h2>
          </div>
          <div id="daily-challenge"></div>
        </div>
      </div>

      <div class="section-title">
        <h2>📚 Apuntes recientes</h2>
        <a href="/pages/notes.html" style="font-size: 12.5px;">Ver todos →</a>
      </div>
      <div class="grid grid--cards" id="recent-notes" style="margin-bottom: 26px;"></div>

      <div class="section-title">
        <h2>⚠️ Recomendado para ti</h2>
      </div>
      <div id="recommendation" class="card"></div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
